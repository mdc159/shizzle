name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Pull-request runs may supersede one another. A master run owns the
  # production deploy call below, so cancelling it could interrupt a live
  # transaction before its rollback step executes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Automation failure-path contracts
        run: |
          bash deploy/vps/tests/test_release_transaction.sh
          bash deploy/runpod/tests/test_repoint.sh
      - run: uv sync --directory library
      - run: uv run --directory library pytest -q -m "not postgres"
      # ops/tests is outside library's configured testpaths; run the ops
      # normalization tests explicitly in the library environment.
      - run: uv run --directory library pytest ../ops/tests/test_normalize_track_metadata.py -q
      - run: uv run --directory library ruff check .
      # Pre-existing strict-mode typing debt, tracked after PR #1.
      # Informational until the debt follow-up lands; then remove this flag.
      - run: uv run --directory library mypy src
        continue-on-error: true

  stemsplit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --directory stemsplit
      - run: uv run --directory stemsplit pytest -q
      - run: uv run --directory stemsplit ruff check .

  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: shizzle
          POSTGRES_PASSWORD: shizzle
          POSTGRES_DB: shizzle
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --directory library
      - run: uv run --directory library pytest -q -m postgres
        env:
          SHIZZLE_TEST_DATABASE_URL: postgresql+asyncpg://shizzle:shizzle@127.0.0.1:5433/shizzle
      - name: Prove head migration downgrade and re-upgrade
        env:
          DATABASE_URL: postgresql+asyncpg://shizzle:shizzle@127.0.0.1:5433/shizzle
        run: |
          uv run --directory library alembic downgrade -1
          uv run --directory library alembic upgrade head

  player:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: player
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: player/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/library-scroll.spec.ts --reporter=list
        env:
          SHIZZLE_E2E_HEADLESS: "1"

  deploy-gate:
    name: Classify merge as deployable or docs-only
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.classify.outputs.deploy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: Classify changed paths
        id: classify
        # A merge whose every changed file is documentation must not rebuild
        # the API image or queue a production deploy — nothing it ships would
        # differ. Fail open: any doubt (no parent, empty diff) deploys.
        run: |
          set -euo pipefail
          if ! git rev-parse "HEAD^" >/dev/null 2>&1; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "HEAD^" HEAD)"
          printf 'changed files:\n%s\n' "$changed"
          if [ -z "$changed" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$changed" | grep -qvE '^(docs/|evidence/|goals/|\.agents/)|\.md$'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only merge; skipping production deploy"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-production:
    name: Deploy production after green master CI
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.deploy-gate.outputs.deploy == 'true'
    needs: [library, stemsplit, postgres-contract, player, deploy-gate]
    permissions:
      contents: read
      packages: write # Publish the digest-pinned API image.
    uses: ./.github/workflows/deploy-vps.yml
    with:
      target_sha: ${{ github.sha }}
    # A called workflow's secrets context holds only what the caller passes;
    # the production environment secrets (VPS_HOST, VPS_SSH_KEY,
    # VPS_SSH_HOST_KEY) resolve empty in the deploy job without this.
    secrets: inherit
