name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --directory library
      - run: uv run --directory library pytest -q -m "not postgres"
      - run: uv run --directory library ruff check .
      # Pre-existing strict-mode typing debt (23 errors, recorded in PR #1).
      # Informational until the debt follow-up lands; then remove this flag.
      - run: uv run --directory library mypy src
        continue-on-error: true

  stemsplit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --directory stemsplit
      - run: uv run --directory stemsplit pytest -q
      - run: uv run --directory stemsplit ruff check .

  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shizzle
          POSTGRES_PASSWORD: shizzle
          POSTGRES_DB: shizzle
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --directory library
      - run: uv run --directory library pytest -q -m postgres
        env:
          SHIZZLE_TEST_DATABASE_URL: postgresql+asyncpg://shizzle:shizzle@127.0.0.1:5433/shizzle

  player:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: player/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
