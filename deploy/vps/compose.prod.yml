# Shizzle production stack — the VPS control plane + static UI + media proxy.
#
# Pull-mode deploys run through .github/workflows/deploy-vps.yml. The GHCR API
# package must be public, or the box must docker login to ghcr.io with a
# read-only PAT. Compose reads ${SHIZZLE_API_IMAGE} from the project-directory
# .env file, not from service env_file entries. For a local source build, use
# the compose.build.yml overlay documented in README.md.
#
# Lives at /opt/shizzle/prod on the box and is run from there:
#   docker compose -p shizzle -f compose.prod.yml up -d
#
# Deploy layout:
#   /opt/shizzle/prod/player/       built player/dist (served by Caddy)
#   /opt/shizzle/prod/Caddyfile     production Caddyfile
#   /opt/shizzle/prod/.env          secrets plus SHIZZLE_API_IMAGE
#   /opt/shizzle/prod/secrets/      cloudfront private key (never committed)
#
# Media (private S3 karaoke-pimpshizzle) is delivered through CloudFront with
# signed cookies; Caddy reverse-proxies the same-origin /cdn path to the
# distribution so the cookies (set on shizzle.systems) ride along. See
# Caddyfile.prod and library/src/shizzle_server/api/cloudfront.py.
#
# caddy_data is the EXTERNAL probe volume — it holds the real Let's Encrypt
# cert/account for shizzle.systems; reusing it avoids re-issuance + rate limits.

name: shizzle

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shizzle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-shizzle}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host — only the compose network reaches 5432.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shizzle} -d ${POSTGRES_DB:-shizzle}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    image: ${SHIZZLE_API_IMAGE:?set SHIZZLE_API_IMAGE in .env}
    container_name: shizzle-api
    # Migrations run as an explicit deploy transaction before services start.
    command: uvicorn shizzle_server.main:app --host 0.0.0.0 --port 8001
    env_file:
      - path: ./.env
        required: true
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shizzle}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shizzle}
      DATA_DIR: /app/data
      SHIZZLE_EMBEDDED_ORCHESTRATOR: "false"
      CLOUDFRONT_PRIVATE_KEY_PATH: /run/secrets/cloudfront_private_key.pem
    volumes:
      - appdata:/app/data
      - ./secrets/cloudfront_private_key.pem:/run/secrets/cloudfront_private_key.pem:ro
    expose:
      - "8001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  orchestrator:
    image: ${SHIZZLE_API_IMAGE:?set SHIZZLE_API_IMAGE in .env}
    container_name: shizzle-orchestrator
    command: python -m shizzle_server.orchestrator
    env_file:
      - path: ./.env
        required: true
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shizzle}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shizzle}
      DATA_DIR: /app/data
      # Production runs the cloud pipeline. The `test` stub is refused unless
      # SHIZZLE_ALLOW_TEST_PIPELINE=1 (invariant C7): on 2026-08-19 it published
      # a track row with no media behind it. The heartbeat (which /api/health
      # reads) runs regardless of pipeline.
      # Parked cloud is a valid state: with RUNPOD_API_KEY / RUNPOD_ENDPOINT_ID
      # unset (the RunPod path is not connected yet) the orchestrator still
      # starts and beats, and new jobs fail closed at dispatch with
      # RUNPOD_DISPATCH_FAILED. Set both variables in .env when the cloud path
      # is connected.
      SHIZZLE_PIPELINE: ${SHIZZLE_PIPELINE:-cloud}
    volumes:
      - appdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: shizzle-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./player:/srv/ui:ro
      - caddy_data:/data # LE certs/account — MUST persist (external below)
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
  caddy_config:
  caddy_data:
    # Reuse the probe stack's cert volume so the existing shizzle.systems
    # Let's Encrypt certificate is preserved across the cutover.
    external: true
    name: shizzle-probe_caddy_data
