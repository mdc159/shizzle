name: deploy-vps

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  build-image:
    uses: ./.github/workflows/api-image.yml
    permissions:
      contents: read
      packages: write

  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://shizzle.systems
    env:
      TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: player/package-lock.json
      - name: Build player
        working-directory: player
        run: npm ci && npm run build
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
      - name: Ship release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          tar -C player -czf /tmp/shizzle-player.tar.gz dist
          ssh root@"$VPS_HOST" 'rm -rf /opt/shizzle/prod/incoming && mkdir -p /opt/shizzle/prod/incoming'
          scp /tmp/shizzle-player.tar.gz deploy/vps/compose.prod.yml deploy/vps/Caddyfile.prod root@"$VPS_HOST":/opt/shizzle/prod/incoming/
      - name: Deploy
        id: deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -o pipefail
          status=0
          ssh root@"$VPS_HOST" bash -s -- "$TAG" <<'REMOTE' | tee /tmp/deploy-output || status=${PIPESTATUS[0]}
          set -euo pipefail
          TAG=$1
          cd /opt/shizzle/prod
          docker pull "ghcr.io/mdc159/shizzle/api:$TAG"
          tar -xzf incoming/shizzle-player.tar.gz -C incoming
          PREV_TAG=$(grep -oP '(?<=^SHIZZLE_API_TAG=).*' .env || echo '')
          trap 'printf "PREV_TAG=%s\n" "$PREV_TAG"' EXIT
          install -m 644 incoming/compose.prod.yml ./compose.prod.yml
          install -m 644 incoming/Caddyfile.prod ./Caddyfile
          sed -i '/^SHIZZLE_API_TAG=/d' .env
          echo "SHIZZLE_API_TAG=$TAG" >> .env
          mkdir -p player
          rsync -a --delete incoming/dist/ player/
          docker compose -p shizzle -f compose.prod.yml up -d
          REMOTE
          prev_tag=$(grep '^PREV_TAG=' /tmp/deploy-output | tail -n 1 | cut -d= -f2- || true)
          printf 'prev_tag=%s\n' "$prev_tag" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Check production health
        run: |
          set -o pipefail
          for attempt in {1..12}; do
            if curl -fsS https://shizzle.systems/ >/dev/null \
              && curl -fsS https://shizzle.systems/api/health \
                | jq -e '.status=="ok" and .db==true and .orchestratorAlive==true' >/dev/null \
              && [ "$(curl -s -o /dev/null -w '%{http_code}' https://shizzle.systems/cdn/tracks/x)" = 403 ]; then
              exit 0
            fi
            echo "Health check attempt $attempt failed; retrying in 10 seconds"
            sleep 10
          done
          exit 1
      - name: Revert on failed health
        if: failure()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          PREV_TAG: ${{ steps.deploy.outputs.prev_tag }}
        run: |
          if [ -z "$PREV_TAG" ]; then
            echo "::notice::No previous API tag was captured; skipping first-deploy revert"
            exit 0
          fi
          echo "::warning::Reverting API and orchestrator to $PREV_TAG. Player assets, Caddyfile, and compose.prod.yml remain from the failed release."
          ssh root@"$VPS_HOST" bash -s -- "$PREV_TAG" <<'REMOTE'
          set -euo pipefail
          PREV_TAG=$1
          cd /opt/shizzle/prod
          sed -i '/^SHIZZLE_API_TAG=/d' .env
          echo "SHIZZLE_API_TAG=$PREV_TAG" >> .env
          docker compose -p shizzle -f compose.prod.yml up -d
          REMOTE
      - name: Retain three API images
        if: success()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh root@"$VPS_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          docker image ls ghcr.io/mdc159/shizzle/api --format '{{.CreatedAt}} {{.ID}}' \
            | sort -r | tail -n +4 | awk '{print $NF}' \
            | while read -r image_id; do
                docker image rm "$image_id" || true
              done
          REMOTE
