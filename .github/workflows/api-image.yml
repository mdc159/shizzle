name: api-image

on:
  workflow_call:
    outputs:
      image_tag:
        description: Immutable API image tag
        value: sha-${{ github.sha }}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: library
          file: library/Dockerfile.api
          push: true
          # The commit-sha tag is the only tag: human-alias tags are
          # re-pushable and therefore not immutable. The digest is the true
          # image identity.
          tags: ghcr.io/mdc159/shizzle/api:sha-${{ github.sha }}
      - name: Report digest
        run: docker buildx imagetools inspect ghcr.io/mdc159/shizzle/api:sha-${{ github.sha }}
