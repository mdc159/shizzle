name: api-image

on:
  workflow_call:
    inputs:
      target_sha:
        description: Reviewed commit SHA to publish
        required: true
        type: string
    outputs:
      image_tag:
        description: API image tag
        value: ${{ jobs.build.outputs.image_tag }}
      image_digest:
        description: Registry content digest
        value: ${{ jobs.build.outputs.image_digest }}
      image_ref:
        description: Tag and digest pinned API image reference
        value: ${{ jobs.build.outputs.image_ref }}

permissions:
  contents: read

concurrency:
  group: api-image-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: sha-${{ inputs.target_sha }}
      image_digest: ${{ steps.build.outputs.digest }}
      image_ref: ghcr.io/mdc159/shizzle/api:sha-${{ inputs.target_sha }}@${{ steps.build.outputs.digest }}
    steps:
      - name: Validate target SHA
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: '[[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::target_sha must be a full lowercase commit SHA"; exit 1; }'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: library
          file: library/Dockerfile.api
          push: true
          tags: ghcr.io/mdc159/shizzle/api:sha-${{ inputs.target_sha }}
      - name: Verify published digest
        env:
          IMAGE_REF: ghcr.io/mdc159/shizzle/api:sha-${{ inputs.target_sha }}@${{ steps.build.outputs.digest }}
        run: docker buildx imagetools inspect "$IMAGE_REF"
