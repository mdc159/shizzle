# Alembic config for the Shizzle control plane schema.
# The DSN comes from DATABASE_URL (env) — see alembic/env.py; the value below
# is only a placeholder for offline tooling.

[alembic]
script_location = alembic
prepend_sys_path = src
sqlalchemy.url = driver://placeholder/overridden-by-DATABASE_URL

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
