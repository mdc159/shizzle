name: api-image

on:
  workflow_call:
    outputs:
      image_tag:
        description: Immutable API image tag
        value: sha-${{ github.sha }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: library
          file: library/Dockerfile.api
          push: true
          # The commit-sha tag is the only tag: human-alias tags are
          # re-pushable and therefore not immutable. The digest is the true
          # image identity.
          tags: ghcr.io/mdc159/shizzle/api:sha-${{ github.sha }}
      - name: Report digest
        run: docker buildx imagetools inspect ghcr.io/mdc159/shizzle/api:sha-${{ github.sha }}
