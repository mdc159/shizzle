# Shizzle production stack — the VPS control plane + static UI + media proxy.
#
# Lives at /opt/shizzle/ on the box and is run from there:
#   docker compose -p shizzle -f compose.prod.yml up -d --build
#
# Deploy layout (rsynced next to this file):
#   /opt/shizzle/library/     server source (built into shizzle-api)
#   /opt/shizzle/player/         built player/dist (served by Caddy)
#   /opt/shizzle/Caddyfile   production Caddyfile (this dir's Caddyfile.prod)
#   /opt/shizzle/.env        real secrets (passcode, POSTGRES_*, AWS_*, CF_*)
#   /opt/shizzle/secrets/    cloudfront private key (mounted, never committed)
#
# Media (private S3 karaoke-pimpshizzle) is delivered through CloudFront with
# signed cookies; Caddy reverse-proxies the same-origin /cdn path to the
# distribution so the cookies (set on shizzle.systems) ride along. See
# Caddyfile.prod and library/src/shizzle_server/cloudfront.py.
#
# caddy_data is the EXTERNAL probe volume — it holds the real Let's Encrypt
# cert/account for shizzle.systems; reusing it avoids re-issuance + rate limits.

name: shizzle

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shizzle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-shizzle}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host — only the compose network reaches 5432.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shizzle} -d ${POSTGRES_DB:-shizzle}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ./library
      dockerfile: Dockerfile.api
    image: shizzle-api
    container_name: shizzle-api
    # Single schema writer: migrate, then serve.
    command: sh -c "alembic upgrade head && uvicorn shizzle_server.main:app --host 0.0.0.0 --port 8001"
    env_file:
      - path: ./.env
        required: true
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shizzle}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shizzle}
      DATA_DIR: /app/data
      SHIZZLE_EMBEDDED_ORCHESTRATOR: "false"
      CLOUDFRONT_PRIVATE_KEY_PATH: /run/secrets/cloudfront_private_key.pem
    volumes:
      - appdata:/app/data
      - ./secrets/cloudfront_private_key.pem:/run/secrets/cloudfront_private_key.pem:ro
    expose:
      - "8001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  orchestrator:
    image: shizzle-api
    container_name: shizzle-orchestrator
    command: python -m shizzle_server.orchestrator
    env_file:
      - path: ./.env
        required: true
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shizzle}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shizzle}
      DATA_DIR: /app/data
      # No Demucs in this image; no new ingest at launch. The heartbeat (which
      # /api/health reads) runs regardless of pipeline. `test` avoids the
      # missing-Demucs warning path.
      SHIZZLE_PIPELINE: ${SHIZZLE_PIPELINE:-test}
    volumes:
      - appdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: shizzle-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./player:/srv/ui:ro
      - caddy_data:/data # LE certs/account — MUST persist (external below)
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
  caddy_config:
  caddy_data:
    # Reuse the probe stack's cert volume so the existing shizzle.systems
    # Let's Encrypt certificate is preserved across the cutover.
    external: true
    name: shizzle-probe_caddy_data
