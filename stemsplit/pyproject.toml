# Tooling config for the RunPod GPU worker. Flat-module layout (handler.py et
# al. import each other as top-level modules inside the container), so this is
# a non-packaged uv project: dependencies + lint/type/test config only.
# Runtime container deps remain pinned by requirements.txt / Dockerfile.

[project]
name = "shizzle-worker"
version = "0.1.0"
description = "Shizzle RunPod serverless GPU worker (Demucs split + mux + S3 staging)"
requires-python = ">=3.11"
authors = [
    { name = "Mike" }
]

dependencies = [
    "runpod>=1.6",
    "boto3>=1.34",
    "requests>=2.31",
    "numpy<2",
    "soundfile>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "responses>=0.25",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-requests>=2.31",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "runpod.*", "soundfile.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
