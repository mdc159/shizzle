name: worker-image

on:
  push:
    branches: [master]
    paths:
      - stemsplit/**
      - .github/workflows/worker-image.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: stemsplit
          file: stemsplit/Dockerfile.lossless
          push: true
          build-args: WORKER_IMAGE=ghcr.io/mdc159/shizzle-worker:sha-${{ github.sha }}
          # The commit-sha tag is the only tag: human-alias tags are
          # re-pushable and therefore not immutable. handoff.json records
          # the image per separation; the digest is the true identity.
          tags: ghcr.io/mdc159/shizzle-worker:sha-${{ github.sha }}
      - name: Report digest
        run: docker buildx imagetools inspect ghcr.io/mdc159/shizzle-worker:sha-${{ github.sha }}
